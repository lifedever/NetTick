<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 2026-11-24 用户从极简方案里选的 M4「半圆对接」：白底（参考 Chrome）+ 上半圆橙（上传）、下半圆蓝（下载），中间留一道白缝。
       备选方案和对比图在 assets/icon-options/ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eceef2"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#163f8f" flood-opacity="0.22"/></filter>
    <linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa064"/><stop offset="1" stop-color="#e8561f"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9fff"/><stop offset="1" stop-color="#1c56c8"/></linearGradient>
  </defs>
  <!-- macOS 图标网格：824 的圆角方块居中，四周留 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
  <g filter="url(#soft)">
    <path d="M250 490 A262 262 0 0 1 774 490 Z" fill="url(#o)"/>
    <path d="M250 534 A262 262 0 0 0 774 534 Z" fill="url(#b)"/>
  </g>
</svg>
